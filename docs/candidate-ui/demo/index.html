<template data-view="interview-feedback"><button class="button back" data-go="interview-practice" type="button">← Practice answer</button><div class="eyebrow">ILLUSTRATIVE FEEDBACK · NO LIVE SCORING</div><h1>Your practice review</h1><p class="muted">These sample rubric values demonstrate the review layout. They are not an assessment of the answer you typed.</p><div class="box"><div class="task"><span>Relevance</span><span>3 / 5</span></div><div class="task"><span>Evidence grounding</span><span>2 / 5</span></div><div class="task"><span>Structure</span><span>2 / 5</span></div><div class="task"><span>Specificity</span><span>2 / 5</span></div></div><h2>Practice improvement</h2><p>Make your personal contribution explicit, describe a decision and support the outcome. Do not add a numerical result unless your evidence establishes it.</p><details><summary>Your answer and session context</summary><p class="small" id="jp3-practice-transcript"></p></details><button class="button primary full" data-go="interview-practice" type="button">Revise and practise again</button><button class="button full" data-go="pipeline" type="button">Return to opportunity record</button></template>

n uploaded.</p></template>

<template data-view="context-cover-choice"><button class="button back" data-go="application-context" type="button">← CV choice</button><h1>Add a short cover letter?</h1><p id="jp16-cover-job"></p><p class="muted">A focused letter can explain your interest and connect your relevant experience to this role. Include one if it adds value or the employer requests it.</p><button class="button primary full" data-act="context-cover" type="button">Generate a short cover letter</button><button class="button full" data-act="context-skip-cover" type="button">Continue without a cover letter</button></template><template data-view="context-package-review"><button class="button back" data-go="context-cover-choice" type="button">← Cover letter</button><h1>Review your application package</h1><p id="jp16-review-job"></p><div id="jp16-package-docs"></div><p class="muted">Approve this selection to download or copy the documents and continue to the employer’s application channel.</p><button class="button primary full" data-act="context-handoff" type="button">Approve package & continue</button></template>
<template data-view="generated-master"><button class="button back" data-go="career" type="button">← Career</button><div class="eyebrow">MASTER CV</div><h1>Your career, professionally presented</h1><p class="muted">Generate a Master CV from your reviewed career profile, including your experience, education, achievements and supporting evidence.</p><div id="jp7-master-status" class="plain-note"></div><button class="button primary full" data-act="generate-master" type="button">Generate Master CV</button><div id="jp7-master-document" class="paper-editor"></div><button class="button full" data-act="edit-master" type="button"><i data-lucide="pencil" aria-hidden="true"></i> Edit Master CV</button><button class="button primary full" data-act="approve-master" type="button">Approve Master CV & review pathways</button><p class="small">Generated draft preview. No AI service is called. Editing creates a new version that needs your approval.</p></template>
<template data-view="cv-editor"><button class="button back" data-act="close-rich-editor" type="button">← CV review</button><div class="eyebrow">CV STUDIO</div><h1>Edit CV Variant</h1><p class="muted">Format the document as it will appear. Save your changes as a draft before approval.</p><div class="rich-toolbar" role="toolbar" aria-label="Document formatting"><button type="button" class="button" data-format="strong" aria-label="Bold"><strong>B</strong></button><button type="button" class="button" data-format="em" aria-label="Italic"><em>I</em></button><button type="button" class="button" data-format="h2">Heading</button><button type="button" class="button" data-format="ul">Bullets</button><button type="button" class="button" data-format="p">Paragraph</button></div><div class="paper-editor" id="jp5-rich" contenteditable="true" role="textbox" aria-multiline="true" aria-label="CV document"></div><p class="small">The current approved version is retained until you approve this revision.</p><button type="button" class="button primary full" data-act="save-rich-draft">Save CV draft</button><button type="button" class="button full" data-go="cv-upload">Upload an externally edited CV</button></template>
<template data-view="cv-upload"><button class="button back" data-go="cv-editor" type="button">← CV editor</button><div class="eyebrow">EXTERNAL REWORK</div><h1>Bring back your edited CV</h1><p class="muted">Compare the upload with your existing CV Variant and the job description before replacing anything.</p><div class="box"><h2>Comparison context</h2><p id="jp5-upload-context"></p><p class="small">Changes to facts, JD keyword coverage and document structure need review.</p></div><label class="field">Reworked CV<input type="file" id="jp5-rework-file" accept=".docx,.pdf"></label><p class="small" id="jp5-file-state">DOCX or PDF. This preview does not upload or scan files.</p><button class="button primary full" data-act="preview-upload-scan" type="button">Preview sample comparison</button><p class="small">The sample report below is separate from any file you select.</p></template>
<template data-view="cv-comparison"><button class="button back" data-go="cv-upload" type="button">← External rework</button><div class="eyebrow">SAMPLE COMPARISON · NOT A FILE SCAN</div><h1>Review the changes</h1><p class="muted">Compared with the source CV Variant and the Service coordinator job description.</p><div class="box"><h2>JD language</h2><div class="task"><span>Service scheduling</span><span class="positive">Supported</span></div><div class="task"><span>Accurate recordkeeping</span><span class="positive">Supported</span></div><div class="task"><span>Stakeholder communication</span><span>Review wording</span></div></div><div class="box"><span class="pill">NEEDS ATTENTION</span><h2>New achievement claim</h2><p>“Reduced processing time by 40%” does not appear in the approved source evidence.</p><label class="field">Decision<select id="jp5-claim-decision"><option value="">Choose a resolution</option><option value="remove">Remove the unsupported claim</option><option value="evidence">Add evidence for review</option></select></label></div><div class="box"><h2>Document checks</h2><p>Sample finding: move contact details out of the page header. Keep section headings and reading order clear.</p><p class="small">Keyword and structure checks support ATS readability; they do not guarantee an ATS ranking or selection.</p></div><button class="button primary full" data-act="accept-upload-sample">Create revised draft from sample</button><p class="small">The uploaded file is never substituted with this sample. The production upload remains pending a real scan.</p></template>
<template data-view="global-search"><button class="button back" data-go="discovery" type="button">← Discovery</button><div class="eyebrow">GLOBAL OPPORTUNITY SEARCH</div><h1>Search beyond your Job Pool</h1><p class="muted">Find new opportunities across available job sources. Viable discoveries enter your Job Pool for processing and recommendation.</p><form data-form="global-search"><label class="field">Position<input name="query" required value="Service coordination"></label><label class="field">Keywords (optional)<input name="keywords" placeholder="e.g. scheduling, records"></label><label class="field">Location<input name="location" value="Nigeria" required></label><label class="field">Employment type<select name="employment"><option value="Any">Any</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option></select></label><label class="field">Work arrangement<select name="arrangement"><option value="Any">Any</option><option>Remote</option><option>Onsite</option><option>Hybrid</option></select></label><label class="field">Career Pathway (optional)<select name="pathway" id="jp5-global-pathway"></select></label><p class="small">Available sources only. Restricted or failed sources are shown separately.</p><button class="button primary full" type="submit">Approve & search globally</button></form><div id="jp5-global-results"></div><button class="row" data-go="pool" type="button"><span>Search your Job Pool instead<small>Find opportunities already collected and assessed as viable</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button></template>
<template data-view="pipeline-move"><button class="button back" data-go="pipeline" type="button">← Pipeline</button><div class="eyebrow">SERVICE COORDINATOR</div><h1>Move this opportunity</h1><p id="jp5-move-from" class="muted"></p><form data-form="board-move"><label class="field">Move to<select id="jp5-move-to" name="stage"></select></label><label class="field">What happened?<textarea name="reason" required minlength="3" placeholder="Add the event or correction behind this move."></textarea></label><label class="choice"><input type="checkbox" name="confirmed" required><span>I confirm this stage reflects what has happened.</span></label><label class="choice" id="jp5-correction-choice"><input type="checkbox" name="correction"><span>This corrects a previously recorded stage. Keep the earlier event in history.</span></label><button class="button primary full" type="submit">Confirm move</button></form></template>
<template data-view="email-activity"><button class="button back" data-go="integration" type="button">← Connected email</button><div class="eyebrow">EMAIL ACTIVITY · DESIGN EXAMPLES</div><h1>Messages that move things forward</h1><p class="muted">Job alerts are screened before they reach your Job Pool. Review credible opportunities and application updates that need your decision.</p><div class="box"><span class="pill">INTERVIEW INVITATION · NEEDS REVIEW</span><h2>Service coordinator</h2><p>Example Community Services</p><p class="small">Matched by role, employer and application reference. No pipeline change has been made.</p><button class="button primary full" data-go="email-event" type="button">Review invitation</button></div><div class="box"><span class="pill">MATCH UNCERTAIN</span><h2>Recruiter message</h2><p class="muted">Two applications could match. Choose the correct opportunity before recording an update.</p><button class="button full" data-act="review-ambiguous-email" type="button">Review possible match</button></div><button class="row" data-go="intake-result" type="button"><span>Job-alert results<small>Viable opportunities and strongest Punts</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button></template>
<template data-view="email-event"><button class="button back" data-go="email-activity" type="button">← Email activity</button><div class="eyebrow">PROPOSED APPLICATION UPDATE</div><h1>Review interview invitation</h1><details open><summary>Source message</summary><p class="small">Example message · no mailbox accessed</p><p>“Thank you for applying for the Service coordinator position. Please confirm your availability for an interview on 24 November at 10:00 WAT.”</p></details><form data-form="email-event"><label class="field">Matched opportunity<select name="opportunity"><option value="service">Service coordinator · Example Community Services</option><option value="unknown">Not sure — keep in review</option></select></label><label class="field">Proposed stage<select name="stage"><option value="INTERVIEW_INVITED">Interview invited</option><option value="INTERVIEW">Interview completed</option><option value="OFFER">Offer</option><option value="LOST">Lost</option></select></label><label class="field">Interview date<input name="date" type="date" value="2026-11-24"></label><label class="field">Time and timezone<input name="time" value="10:00 WAT"></label><label class="field">Event details<textarea name="details" required>Invitation to discuss the Service coordinator position. Availability confirmation requested.</textarea></label><p class="small">Edit any extracted detail before approval. Approving this event does not send a reply or confirm attendance.</p><button class="button primary full" type="submit">Approve pipeline update</button><button class="button full" data-act="dismiss-email-event" type="button">Dismiss suggestion</button></form></template>

<template data-view="onboarding-welcome"><div class="eyebrow">WELCOME</div><h1>Welcome to JobPunter</h1><p class="muted">Find opportunities, discover your strongest matches and get your application ready.</p><div class="welcome-journey"><div><i data-lucide="search" aria-hidden="true"></i><span>Start with a search<small>Explore jobs that meet your preferences.</small></span></div><div><i data-lucide="file-user" aria-hidden="true"></i><span>Add your CV<small>See which opportunities fit your experience.</small></span></div><div><i data-lucide="send" aria-hidden="true"></i><span>Prepare your application<small>Review your documents, then submit on the employer portal.</small></span></div></div><button class="button primary full" data-go="create-account" type="button">Get started</button><button class="button full" data-go="entry" type="button">I already have an account</button><p class="small section">You can explore opportunities before completing your career profile.</p></template>
<template data-view="create-account"><button class="button back" data-go="onboarding-welcome" type="button">← Welcome</button><div class="eyebrow">YOUR ACCOUNT</div><h1>Let’s get you started</h1><form data-form="starter-account"><label class="field">Your name<input name="name" autocomplete="name" required maxlength="100" placeholder="Full name"></label><label class="field">Gmail address<input name="email" type="email" autocomplete="email" required placeholder="name@gmail.com"></label><button class="button primary full" type="submit">Create account</button></form><p class="small section">Creating an account does not connect your mailbox. Email access requires separate permission.</p><p class="small">Design preview: no account is created and no verification email is sent.</p></template>
<template data-view="home"><div class="eyebrow" id="jp6-greeting">YOUR HOME</div><h1>Find your next job</h1><p class="muted">Search beyond your Job Pool. Start with the role and working arrangement that suit you.</p><form data-form="starter-search" class="home-search"><label class="field">Position<input name="query" placeholder="e.g. Service coordinator" value="Service coordinator" required></label><div class="form-pair"><label class="field">Keywords (optional)<input name="keywords" placeholder="e.g. scheduling, records"></label><label class="field">Location<input name="location" value="Lagos" required></label><label class="field">Work arrangement<select name="arrangement"><option value="Any">Any</option><option>Remote</option><option>Onsite</option><option selected>Hybrid</option></select></label></div><label class="field">Employment type<select name="employment"><option value="Any">Any</option><option selected>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option></select></label><button class="button primary full" type="submit">Find jobs</button><button class="button full" data-go="global-search" type="button">More search options</button></form><div id="jp6-home-content"></div><section class="section"><h2>Quick links</h2><div class="quick-links"><button class="button" data-go="pool" type="button">Job Pool</button><button class="button" data-go="quick-cv" type="button">Add your CV</button><button class="button" data-go="setup-progress" type="button">Career setup</button><button class="button" data-go="notifications" type="button">Updates</button><button class="button" data-go="support" type="button">Help</button></div></section></template>
<template data-view="first-search-home"><div class="eyebrow" id="jp6-greeting">YOUR HOME</div><h1>Find your next job</h1><p class="muted">Search beyond your Job Pool. Start with the role and working arrangement that suit you.</p><form data-form="starter-search" class="home-search"><label class="field">Position<input name="query" placeholder="e.g. Service coordinator" value="Service coordinator" required></label><div class="form-pair"><label class="field">Keywords (optional)<input name="keywords" placeholder="e.g. scheduling, records"></label><label class="field">Location<input name="location" value="Lagos" required></label><label class="field">Work arrangement<select name="arrangement"><option value="Any">Any</option><option>Remote</option><option>Onsite</option><option selected>Hybrid</option></select></label></div><label class="field">Employment type<select name="employment"><option value="Any">Any</option><option selected>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option></select></label><button class="button primary full" type="submit">Find jobs</button><button class="button full" data-go="global-search" type="button">More search options</button></form><div id="jp6-home-content"></div><section class="section"><h2>Quick links</h2><div class="quick-links"><button class="button" data-go="pool" type="button">Job Pool</button><button class="button" data-go="quick-cv" type="button">Add your CV</button><button class="button" data-go="setup-progress" type="button">Career setup</button><button class="button" data-go="notifications" type="button">Updates</button><button class="button" data-go="support" type="button">Help</button></div></section></template>
<template data-view="quick-cv"><button class="button back" data-go="pool" type="button">← Job Pool</button><div class="eyebrow">MATCH YOUR EXPERIENCE</div><h1>Find your strongest Punts</h1><p class="muted">Add your CV to compare your experience with the jobs you’ve already found. Your search results stay in place.</p><form data-form="starter-cv"><label class="field">Your CV<input name="cv" type="file" accept=".pdf,.docx"></label><label class="choice"><input name="approve" type="checkbox" required><span>Prepare a CV review for matching with my search results.</span></label><button class="button primary full" type="submit">Review CV for matching</button></form><p class="small section">This preview uses an example CV. Selected files are not read or uploaded.</p><button class="button full" data-go="pool" type="button">Continue browsing</button></template>
<template data-view="quick-cv-review"><button class="button back" data-go="quick-cv" type="button">← CV upload</button><div class="eyebrow" id="jp6-cv-status">UPLOADED CV · NEEDS REVIEW</div><h1>Review your CV</h1><p class="muted">Check the content before it is used to assess your matches. Your full career profile can come later.</p><button class="button" data-act="starter-edit-cv" type="button"><i data-lucide="pencil" aria-hidden="true"></i>Edit CV</button><div class="document section" id="jp6-cv-body"></div><button class="button primary full" data-act="starter-match-cv" type="button">Approve CV & match results</button><p class="small section">This approves this CV and fit analysis of the collected jobs, and authorizes background preparation of a career profile and suggested Career Pathways. Those drafts need your review; no new job search is run.</p></template>
<template data-view="first-application"><div class="eyebrow">SUBMISSION RECORDED</div><h1>Your application is in motion</h1><p class="muted">Track this opportunity in your pipeline. Record replies, interview invitations and offers as they arrive.</p><div class="box"><h2>What happens next?</h2><p>Employer response times vary. A quiet inbox does not mean rejection.</p><p class="muted">Connected-email monitoring will need a working, authorized Gmail integration. Until then, add updates manually or paste a message for review.</p><button class="button full" data-go="pipeline" type="button">Open your pipeline</button></div><div class="feature"><div class="eyebrow">YOUR NEXT STEP</div><h2>Give your next match more context</h2><p class="muted">Complete your career profile to include experience, education, evidence and preferences that may not appear in your CV.</p><button class="button full" data-go="welcome-upload" type="button">Continue career setup</button></div><button class="button full" data-go="recommendation-schedule" type="button">Get fresh matches each morning</button><button class="button full" data-go="home" type="button">Back to Home</button></template>
<template data-view="setup-progress"><button class="button back" data-go="home" type="button">← Home</button><div class="eyebrow">CAREER SETUP</div><h1>Build a clearer career picture</h1><p class="muted">Keep searching and applying while you complete these four phases. Each step gives your recommendations more useful context.</p><div id="jp6-setup-steps"></div><button class="button full" data-go="home" type="button">Continue exploring</button></template>
<template data-view="recommendation-schedule"><button class="button back" data-go="home" type="button">← Home</button><div class="eyebrow">RECOMMENDATIONS ON YOUR TIME</div><h1>Set your search rhythm</h1><p class="muted">Use your reviewed CV and search preferences now. Add your career profile and pathways when ready.</p><p class="small" id="jp6-schedule-source"></p><form data-form="starter-schedule"><label class="field">Matching context<select name="source" id="jp6-matching-context"><option value="cv">Reviewed CV & search filters</option><option value="profile">Completed career setup</option></select></label><label class="field">When to search<select name="cadence" id="jp6-cadence"><option value="morning">Each morning</option><option value="interval">Every 24 hours</option><option value="daily">Daily at my chosen time</option><option value="weekly">Weekly</option></select></label><label class="field">Local time<input name="time" type="time" value="08:00" required></label><label class="field" id="jp6-weekday">Day<select name="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label><label class="field">Timezone<select name="timezone"><option>Africa/Lagos</option><option>Africa/Accra</option><option>Africa/Nairobi</option><option>UTC</option></select></label><label class="choice"><input name="consent" type="checkbox" required><span>Approve recurring discovery and CV matching with these preferences. I can pause or cancel it at any time.</span></label><button class="button primary full" type="submit">Approve schedule</button></form><div id="jp6-schedule-state"></div><p class="small section">Scheduling never approves documents or submits applications for you.</p></template>
<template data-view="recommendation-digest"><button class="button back" data-go="home" type="button">← Home</button><div class="eyebrow">YOUR SCHEDULED UPDATE · PREVIEW</div><h1>Your latest search update</h1><div id="jp6-digest-results"></div><div id="jp6-digest-prompt"></div><button class="button full" data-go="recommendation-schedule" type="button">Manage this schedule</button></template>

function cleanRich(raw){const doc=new DOMParser().parseFromString(raw,'text/html');const allowed=new Set(['P','DIV','BR','H2','H3','STRONG','B','EM','I','UL','OL','LI','U','A','SPAN','BLOCKQUOTE']);

}

 function build(){stack.replaceChildren();const nodes=doc.children.length?[...doc.children]:[element('p','',doc.textContent)];let page;const newPage=()=>{page=element('section','jp-paper-page');page.setAttribute('aria-label','A4 page '+(stack.children.length+1));stack.append(page);};newPage();for(const node of nodes){const clone=node.cloneNode(true);page.append(clone);if(page.scrollHeight>page.clientHeight+1&&page.children.length>1){clone.remove();newPage();page.append(clone);}if(page.scrollHeight>page.clientHeight+1){const note=element('p','small','This content needs pagination refinement before export.');wrap.append(note);page.style.overflow='auto';}}const scale=Math.min(1,viewport.clientWidth/794);stack.style.transform='scale('+scale+')';viewport.style.height=(stack.offsetHeight*scale)+'px';}

  if(o.search){const f=content.querySelector('form');for(const key of ['query','keywords','location','employment','arrangement'])if(f.elements[key])f.elements[key].value=o.search[key];}
 }
 if(state.view==='pool')renderStarterPool();if(state.view==='assisted-punts')renderStarterPunts();
 if(state.view==='global-search'){
  const f=content.querySelector('form'),select=$('jp5-global-pathway');if(select){select.replaceChildren();const any=element('option','','Use my search filters');any.value='';select.append(any);state.lanes.forEach((l,i)=>{if(l.status==='APPROVED'){const option=element('option','',l.title);option.value=i;select.append(option);}});}f.querySelector('button[type=submit]').disabled=false;
  if(o.search)for(const key of ['query','keywords','location','employment','arrangement'])if(f.elements[key])f.elements[key].value=o.search[key];
  if(o.search){const result=$('jp5-global-results');result.replaceChildren(element('p','section',o.lastFound+' sample opportunities met these filters.'));const b=element('button','button full','View Job Pool');b.type='button';b.dataset.go='pool';result.append(b);}
 }
 if(state.view==='quick-cv-review'){text('jp6-cv-status',o.cv?'UPLOADED CV · V'+o.cv.version+' · '+(o.cv.accepted?'APPROVED':'NEEDS REVIEW'):'ADD A CV FIRST');text('jp6-cv-body',o.cv?.body||'Add a CV to prepare this review.');if(o.cv?.richHtml)$('jp6-cv-body').innerHTML=cleanRich(o.cv.richHtml);}

 if(state.view==='setup-progress'){setupPhases().forEach((phase,i)=>{const box=element('section','box');box.append(element('span','pill','PHASE '+(i+1)+' · '+(phase.done?'COMPLETE':'TO DO')),element('h2','',phase.title),element('p','muted',phase.detail));const b=element('button','button full',phase.done?'Review':'Continue');b.type='button';b.dataset.go=phase.target;box.append(b);$('jp6-setup-steps').append(box);});}
 if(state.view==='career'){const link=element('button','button primary full','View your four setup phases');link.type='button';link.dataset.go='setup-progress';content.querySelector('h1').after(link);}
 if(starterContext()){
  text('jp3-punt-lane','Matched to your reviewed CV');text('jp3-punt-cv','Uploaded CV v'+o.cv.version+' · reviewed. Career Pathways not yet selected.');text('jp3-ready-lane','Your reviewed CV');text('jp3-ready-cv','CV-based matching uses the experience you reviewed. Complete your profile later for wider evidence and Career Pathways.');
  if(state.view==='punt-assistance'){content.querySelector('h1').textContent='Prepare your application';const p=content.querySelector('.box+p');if(p)p.textContent='Tailor your CV to the job description, add a cover letter if needed, then approve the package.';const use=content.querySelector('[data-act=use-frontline]');if(use)use.textContent='Use this reviewed CV';}
  if(state.view==='assisted-package'){const source=content.querySelector('details p');if(source)source.textContent='Reviewed uploaded CV v'+o.cv.version+', current job description and approved application documents. Master Career Profile and Career Pathways are not yet approved.';}if(state.view==='portal-questions'){const lead=content.querySelector('p.muted');if(lead)lead.textContent='Answers use your reviewed CV and this job description. Any missing facts need your input.';}
  if(state.view==='assisted-package'&&!state.useAdapted)text('jp3-delivery-cv',state.cvChoice?'Reviewed uploaded CV v'+o.cv.version:'Choose your reviewed CV or approve its tailored draft.');
 }
 if(state.view==='recommendation-schedule'){
  const context=$('jp6-matching-context');context.querySelector('[value=profile]').disabled=!setupPhases().every(p=>p.done);context.value=o.schedule?.source||(setupPhases().every(p=>p.done)?'profile':'cv');
  text('jp6-schedule-source',o.cv?.accepted?'Matching source: reviewed CV v'+o.cv.version+' · saved search filters.':'Review a CV before enabling scheduled matching.');const form=content.querySelector('form');const sourceReady=()=>{const full=context.value==='profile';form.querySelector('button[type=submit]').disabled=!(full?setupPhases().every(p=>p.done):o.cv?.accepted&&o.search);text('jp6-schedule-source',full?'Matching source: approved profile, preferences, Career Pathways and CV Variants.':o.cv?.accepted?'Matching source: reviewed CV v'+o.cv.version+' · saved search filters.':'Review a CV before enabling scheduled matching.');};context.addEventListener('change',sourceReady);sourceReady();
  if(o.schedule){for(const key of ['cadence','time','day','timezone'])form.elements[key].value=o.schedule[key];const box=element('div','box');box.append(element('h2','',o.schedule.paused?'Schedule paused':'Schedule approved'),element('p','muted',scheduleLabel(o.schedule)));for(const [label,action] of [[o.schedule.paused?'Resume schedule':'Pause schedule',o.schedule.paused?'resume-starter-schedule':'pause-starter-schedule'],['Cancel schedule','cancel-starter-schedule'],['Preview scheduled update','preview-starter-digest']]){const b=element('button','button full',label);b.type='button';b.dataset.act=action;box.append(b);}$('jp6-schedule-state').append(box);}
  const cadence=$('jp6-cadence');const sync=()=>{$('jp6-weekday').hidden=cadence.value!=='weekly';form.elements.time.closest('label').hidden=cadence.value==='interval';form.elements.time.required=cadence.value!=='interval';};cadence.addEventListener('change',sync);sync();
 }
 if(state.view==='recommendation-digest'){

 }

function scheduleStillCurrent(schedule){const o=onboarding();return schedule.source==='profile'?state.profileApproved&&state.profileRevision===schedule.profileRevision&&JSON.stringify(state.forms.preferences||{})===schedule.preferences&&schedule.variants.every(v=>state.lanes.some(l=>l.status==='APPROVED'&&l.title===v.title&&l.cv?.accepted&&l.cv.version===v.version)):!!(o.cv?.accepted&&o.cv.version===schedule.cvVersion);}
function scheduleLabel(schedule){return schedule.cadence==='interval'?'Every 24 hours from approval · '+schedule.timezone:(schedule.cadence==='weekly'?schedule.day+'s':schedule.cadence==='morning'?'Each morning':'Daily')+' at '+schedule.time+' · '+schedule.timezone;}
function progressiveAction(action){if(evaluateAction(action))return true;if(optionalCVAction(action)||careerUpgradeAction(action))return true;const o=onboarding();switch(action){
 case'starter-match-cv':if(!o.cv){say('Add a CV first.');return true;}if(!o.pool.length){go('global-search','Find opportunities before matching this CV.');return true;}o.cv.accepted=true;o.cvMatches=true;seedCareerFromCV();state.profileReady=true;o.backgroundDraft={cvVersion:o.cv.version,profile:'DRAFT',pathways:'SUGGESTED'};log('Career profile draft prepared','Reviewed CV source · candidate approval pending');log('Uploaded CV reviewed and matching approved','CV v'+o.cv.version+' · existing search results only');go('assisted-punts','CV-based matches are ready. Full career setup remains optional for this first application.');return true;
 case'starter-edit-cv':if(!o.cv){say('Add a CV first.');return true;}state.richContext='quick';state.richReturn='quick-cv-review';state.richBase={body:o.cv.body,version:o.cv.version,variantVersion:o.cv.version,jdVersion:2};state.richDraftKey='quick:'+o.cv.version;state.richWorking=state.richPending?.[state.richDraftKey]||o.cv.richHtml||null;go('cv-editor');return true;
 case'snooze-setup':{const phase=nextSetup();if(phase)o.snoozed=phase.id+':'+o.digest;render();say('You can continue setup from Career whenever you’re ready.');return true;}
 case'pause-starter-schedule':if(o.schedule)o.schedule.paused=true;render();say('Schedule paused in this preview.');return true;
 case'cancel-starter-schedule':o.schedule=null;render();say('Schedule cancelled. Your search results and documents remain.');return true;
 case'resume-starter-schedule':if(!o.schedule)return true;if(!scheduleStillCurrent(o.schedule)){say('Your matching context has changed. Review it and approve an updated schedule.');return true;}o.schedule.paused=false;render();say('Approved schedule resumed in this preview.');return true;
 case'preview-starter-digest':if(!o.schedule||o.schedule.paused){say('Approve or resume a schedule first.');return true;}if(!scheduleStillCurrent(o.schedule)){o.schedule.paused=true;render();say('The matching context changed. Review it and approve the revised schedule.');return true;}o.digest++;go('recommendation-digest','Scheduled-update preview. No real background search was run.');return true;
 default:return false;}}
function progressiveForm(kind,data){if(evaluateForm(kind,data))return true;if(optionalCVForm(kind,data))return true;const o=onboarding();
 if(kind==='starter-account'){o.started=true;o.firstJourney=true;o.name=String(data.get('name')).trim();o.email=String(data.get('email')).trim();go('first-search-home','Example account setup complete. No live account was created.');return true;}
 if(kind==='starter-search'||kind==='global-search'){
 
  o.started=true;const filters={keywords:String(data.get('keywords')||'').trim(),query:String(data.get('query')).trim(),location:String(data.get('location')).trim(),employment:String(data.get('employment')||'Any'),arrangement:String(data.get('arrangement')||'Any')};o.search=filters;o.searchCount++;
  const terms=filters.query.toLowerCase().split(/\s+/).filter(Boolean),location=filters.location.toLowerCase();const keywords=filters.keywords.toLowerCase().split(/[,\s]+/).filter(Boolean);const found=processedSearchPool().filter(j=>keywords.every(k=>(j.terms+' '+j.title).toLowerCase().includes(k))&&terms.every(t=>(j.terms+' '+j.title).toLowerCase().includes(t))&&(j.location.toLowerCase().includes(location)||j.country.toLowerCase().includes(location)||location==='anywhere')&&(filters.employment==='Any'||j.employment===filters.employment)&&(filters.arrangement==='Any'||j.arrangement===filters.arrangement));
  o.lastFound=found.length;found.forEach(job=>{if(!o.pool.some(j=>j.id===job.id))o.pool.push({...job,searchRevision:o.searchCount,discoveryFilters:{...filters}});});o.cvMatches=false;log('Job search completed','Saved search preferences · sample opportunities');runDiscoveryPreview('JobPunter search',found,'',filters);return true;
 }
 if(kind==='starter-cv'){o.started=true;o.cv={version:(o.cv?.version||0)+1,accepted:false,body:profileDocument(state.lanes[0]),origin:'uploaded-cv',history:o.cv?[{...o.cv}]:[]};o.cvMatches=false;go('quick-cv-review','Example CV prepared for review. No selected file was read or uploaded.');return true;}
 if(kind==='assisted-submission'&&o.started){if(!state.deliveryApproved||state.pipelineStage!=='READY'){say('Approve the package before recording submission.');return true;}state.pipelineStage='APPLIED';addAssistedEvent('Application submitted','Candidate confirmation: '+String(data.get('reason')));go('first-application','Submission recorded in the example. No application was sent by JobPunter.');return true;}
 if(kind==='starter-schedule'){const source=String(data.get('source')||'cv');if(!(source==='profile'?setupPhases().every(p=>p.done):o.cv?.accepted&&o.search)){say('Review a CV and run a search before scheduling recommendations.');return true;}o.schedule={source,profileRevision:state.profileRevision,preferences:JSON.stringify(state.forms.preferences||{}),variants:state.lanes.filter(l=>l.status==='APPROVED').map(l=>({title:l.title,version:l.cv?.version})),cadence:String(data.get('cadence')),time:String(data.get('time')||'08:00'),day:String(data.get('day')),timezone:String(data.get('timezone')),cvVersion:o.cv?.version||null,filters:source==='profile'?{...state.forms.preferences,pathways:state.lanes.filter(l=>l.status==='APPROVED').map(l=>l.title)}:{...o.search},paused:false};log('Recurring discovery scope approved','CV snapshot and filter snapshot · no automatic submission');go('recommendation-schedule','Schedule approved in the preview. No background job was created.');return true;}
 if(kind==='assisted-upload'&&o.started&&o.cv?.accepted){seedCareerFromCV();state.profileReady=true;go('assembled-profile','Career profile draft ready. Review the imported facts and add missing background.');return true;}
 if(kind==='assembled-profile'&&o.started){state.profileApproved=true;state.profileStart=String(data.get('start'));approveRecordGroup('profile');const rec=profileRecord('experience');rec.value=rec.value.replace('Start date: awaiting source review','Start date: '+(state.profileStart==='2022-03'?'March':'April')+' 2022');go('preferences','Profile approved. Review your preferences to finish this phase.');return true;}
 if(kind==='preferences'){state.forms.preferences=Object.fromEntries(data.entries());o.preferencesReviewed=true;log('Preferences reviewed','Candidate-confirmed search preferences');go('generated-master','Career details reviewed. Generate and approve your Master CV before reviewing Career Pathways.');return true;}
 return false;
}
